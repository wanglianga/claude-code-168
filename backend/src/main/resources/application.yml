server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market}
    username: ${DB_USER:market}
    password: ${DB_PASSWORD:market123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt-secret: ${JWT_SECRET:rural-market-platform-jwt-secret-key-please-change-in-production-0123456789abcdef}
  jwt-expire-hours: 24
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    org.hibernate.SQL: warn
