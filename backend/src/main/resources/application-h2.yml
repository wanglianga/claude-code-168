# 免数据库快速体验：SPRING_PROFILES_ACTIVE=h2
spring:
  datasource:
    url: jdbc:h2:mem:market;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
